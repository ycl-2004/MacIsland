name: CI

on:
  push:
    branches:
      - main
      - dev
      - nightly
      - alpha
      - beta
  pull_request:
    branches: [main, dev, nightly, alpha, beta]
  workflow_dispatch:

jobs:
  build:
    name: Build

    # Skip CI-generated commits (appcast updates, changelog archives)
    if: >-
      !contains(github.event.head_commit.message, 'ci: update appcast') &&
      !contains(github.event.head_commit.message, 'ci: archive changelog')

    strategy:
      matrix:
        # Exact Xcode; dependency resolution must use the committed lockfile.
        macos_version: [macos-26]
      fail-fast: false
    runs-on: ${{ matrix.macos_version }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Validate privacy configuration
        run: python3 -m unittest tests.test_privacy_configuration

      - name: Validate timer lifecycle cleanup
        run: python3 -m unittest tests.test_timer_lifecycle

      - name: Download Metal Toolchain
        # The downloadable Metal Toolchain is an Xcode 26+ (macOS 26) component; older Xcode ships metal.
        run: |
          sudo xcodebuild -runFirstLaunch || true
          MAJOR=$(sw_vers -productVersion | cut -d. -f1)
          if [ "$MAJOR" -ge 26 ]; then
            downloaded=false
            for i in 1 2 3 4 5; do
              if sudo xcodebuild -downloadComponent MetalToolchain; then downloaded=true; break; fi
              sleep 10
            done
            if [ "$downloaded" = false ] && ! xcrun -f metal >/dev/null 2>&1; then
              echo "::error::Metal Toolchain download failed after 5 attempts and metal is unavailable."
              exit 1
            fi
          else
            echo "macOS $MAJOR: Metal ships with Xcode, skipping download."
          fi

      - name: Native and fixture regressions
        run: |
          sudo DevToolsSecurity -enable
          python3 Tools/verify-stability.py --output Build/ci-verification

      - name: Release build
        run: >-
          xcodebuild build -project DynamicIsland.xcodeproj -scheme DynamicIsland
          -configuration Release -destination 'platform=macOS' -derivedDataPath Build
          -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile
          CODE_SIGNING_ALLOWED=NO > Build/ci-release.log 2>&1

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stability-${{ matrix.macos_version }}
          path: |
            Build/ci-verification/*.log
            Build/ci-verification/steps.json
            Build/ci-verification/native.xcresult
            Build/ci-release.log
          if-no-files-found: ignore
          retention-days: 7
